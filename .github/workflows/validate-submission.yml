name: Validate leaderboard submission

on:
  pull_request_target:
    paths:
      - "submissions/**/*.json"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      LEADERBOARD_PRIVATE_KEY_PEM: ${{ secrets.LEADERBOARD_PRIVATE_KEY_PEM }}
    steps:
      - name: Check out trusted validator
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false
      - name: Check out untrusted candidate as data only
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: candidate
          persist-credentials: false
      - name: Validate changed JSON with trusted code
        run: >-
          python trusted/scripts/validate_pr.py
          --candidate candidate
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"
          --author "${{ github.event.pull_request.user.login }}"
